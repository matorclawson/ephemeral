name: Arm64 release
on:
  pull_request:
  push:
    tags: ['v*']
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test test-portable examples release verify
      - run: |
          cp dist/linux-arm64/ephemeral ./ephemeral
          python3 examples/demo.py
          test "$(./ephemeral --version)" = "$(cat VERSION)"
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
