<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" role="img" aria-label="Go applications use the engine directly; other workers use the CLI. The engine stores everything in one local SQLite database." font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect width="700" height="350" rx="8" fill="#1a1a19"/><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3c2b7"/></marker></defs><rect x="20" y="20" width="200" height="90" rx="8" fill="none" stroke="#383835" stroke-width="1.5"/><text x="120.0" y="46" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Go application</text><text x="120.0" y="68" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">imports package ephemeral</text><rect x="20" y="140" width="200" height="90" rx="8" fill="none" stroke="#383835" stroke-width="1.5"/><text x="120.0" y="166" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Worker in any language</text><text x="120.0" y="188" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">JSON lines on</text><text x="120.0" y="206" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">stdin and stdout</text><rect x="280" y="140" width="130" height="90" rx="8" fill="none" stroke="#383835" stroke-width="1.5"/><text x="345.0" y="166" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">ephemeral CLI</text><text x="345.0" y="188" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">one process</text><rect x="470" y="60" width="210" height="130" rx="8" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="575.0" y="86" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Engine</text><text x="575.0" y="108" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">workflows, leases,</text><text x="575.0" y="126" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">retries, timers, signals,</text><text x="575.0" y="144" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">child workflows</text><rect x="470" y="240" width="210" height="90" rx="8" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="575.0" y="266" fill="#f0efec" font-size="15" font-weight="600" text-anchor="middle">Local SQLite database</text><text x="575.0" y="288" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">state, pending work, history</text><text x="575.0" y="306" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="middle">on local disk</text><path d="M222 65L468 95" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#h)" marker-start="url(#h)"/><path d="M222 185L278 185" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#h)" marker-start="url(#h)"/><path d="M412 185L468 160" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#h)" marker-start="url(#h)"/><path d="M575 192L575 238" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#h)" marker-start="url(#h)"/><text x="20" y="322" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="start">No server to run. One host.</text></svg>
