<svg xmlns="http://www.w3.org/2000/svg" width="700" height="276" viewBox="0 0 700 276" role="img" aria-label="Latency p50, p95, p99: Linux arm64 5.94, 8.33, 10.48 ms; Apple M4 Max 0.43, 0.75, 1.12 ms" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect width="700" height="276" rx="8" fill="#1a1a19"/><text x="24" y="32" fill="#f0efec" font-size="16" font-weight="600" text-anchor="start">Start-poll-finish latency, milliseconds (lower is better)</text><rect x="24" y="47" width="10" height="10" rx="2" fill="#3987e5"/><text x="40" y="56" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Linux arm64, 2 vCPU Neoverse-N1, ext4</text><rect x="354" y="47" width="10" height="10" rx="2" fill="#d95926"/><text x="370" y="56" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start">Apple M4 Max, macOS arm64, APFS</text><text x="78" y="101" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="end">p50</text><path d="M90 76h290.7a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-290.7z" fill="#3987e5"/><text x="392.7" y="90" fill="#f0efec" font-size="13" font-weight="400" text-anchor="start">5.94 ms</text><path d="M90 96h17.3a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-17.3z" fill="#d95926"/><text x="119.3" y="110" fill="#f0efec" font-size="13" font-weight="400" text-anchor="start">0.43 ms</text><text x="78" y="159" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="end">p95</text><path d="M90 134h409.3a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-409.3z" fill="#3987e5"/><text x="511.3" y="148" fill="#f0efec" font-size="13" font-weight="400" text-anchor="start">8.33 ms</text><path d="M90 154h33.2a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-33.2z" fill="#d95926"/><text x="135.2" y="168" fill="#f0efec" font-size="13" font-weight="400" text-anchor="start">0.75 ms</text><text x="78" y="217" fill="#c3c2b7" font-size="13" font-weight="400" text-anchor="end">p99</text><path d="M90 192h516.0a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-516.0z" fill="#3987e5"/><text x="618.0" y="206" fill="#f0ef